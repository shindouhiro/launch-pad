name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKER_USERNAME: shindouhiro
  BACKEND_IMAGE: shindouhiro/launchpad-backend
  FRONTEND_IMAGE: shindouhiro/launchpad-frontend

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 Release ${{ steps.get_version.outputs.VERSION }}
            
            ### Docker Images
            - Backend: `${{ env.BACKEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}`
            - Frontend: `${{ env.FRONTEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}`
            
            ### Changes
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### Installation
            ```bash
            docker pull ${{ env.BACKEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}
            docker pull ${{ env.FRONTEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}
            ```
          draft: false
          prerelease: false

  build-and-push:
    name: Build and Push Release Images
    runs-on: ubuntu-latest
    needs: create-release
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set image name
        id: image
        run: |
          if [ "${{ matrix.service }}" == "backend" ]; then
            echo "NAME=${{ env.BACKEND_IMAGE }}" >> $GITHUB_OUTPUT
            echo "CONTEXT=./apps/backend" >> $GITHUB_OUTPUT
          else
            echo "NAME=${{ env.FRONTEND_IMAGE }}" >> $GITHUB_OUTPUT
            echo "CONTEXT=./apps/portal" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.image.outputs.CONTEXT }}
          file: ${{ steps.image.outputs.CONTEXT }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.NAME }}:${{ steps.get_version.outputs.VERSION }}
            ${{ steps.image.outputs.NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Release notification
        run: |
          echo "🎉 Release ${{ steps.get_version.outputs.VERSION }} completed!"
          echo "✅ Docker images pushed to Docker Hub"
          echo "📦 Backend: ${{ env.BACKEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}"
          echo "📦 Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.get_version.outputs.VERSION }}"
