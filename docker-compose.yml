version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchpad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: launchpad-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: launchpad
      # 应用配置
      PORT: 3001
      NODE_ENV: production
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      # 七牛云配置
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY}
      QINIU_BUCKET: ${QINIU_BUCKET}
      QINIU_DOMAIN: ${QINIU_DOMAIN}
      QINIU_ZONE: ${QINIU_ZONE:-z2}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./apps/portal
      dockerfile: Dockerfile
    container_name: launchpad-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # 服务器端 API URL（用于 rewrites，可以使用容器名）
      SERVER_API_URL: http://backend:3001
      # 客户端不需要 NEXT_PUBLIC_API_URL，因为会通过 /api 代理访问
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
